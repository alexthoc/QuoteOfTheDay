<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <style>
    :root { --bg: #f6f3ee; --surface: #fff; --text: #22201c; --muted: #6b665e; --border: #e2ddd3; --accent: #8a4b2a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14130f; --surface: #1f1d18; --text: #efebe3; --muted: #a39d92; --border: #36322a; --accent: #e0a279; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .intro { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.project { display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: inherit; text-decoration: none; }
    a.project:hover, a.project:focus-visible { border-color: var(--accent); }
    .name { font-weight: 600; color: var(--accent); }
    .desc { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Playground</h1>
    <p class="intro">Small experiments built while trying out Claude features. Each one lives in its own folder.</p>
    <ul>
      <!-- Add a new <li> here for each project folder. -->
      <li>
        <a class="project" href="quote-of-the-day/">
          <span class="name">Quote of the Day</span>
          <p class="desc">One quote per calendar day, with a button for a random other one.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
